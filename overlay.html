<html>
<head>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;

      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="crosshair"></canvas>
  <script src="overlay.js"></script>
</body>
</html>
